<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tata Motors AI Assistant | Pro</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }

        :root {
            --primary: #3b82f6;
            --primary-light: #93c5fd;
            --primary-dark: #2563eb;
            --accent-teal: #14b8a6;
            --accent-emerald: #10b981;
            --accent-rose: #f43f5e;

            --bg-canvas: #fafbfc;
            --bg-elevated: #ffffff;
            --glass-bg: rgba(255, 255, 255, 0.92);
            --glass-border: rgba(200, 210, 230, 0.5);

            --text-main: #1e293b;
            --text-sub: #64748b;
            --text-muted: #94a3b8;

            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.06);
            --shadow-xl: 0 20px 40px rgba(0, 0, 0, 0.1);

            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;

            --spacing-sm: 10px;
            --spacing-md: 14px;
            --spacing-lg: 20px;
            --spacing-xl: 28px;

            --bg-app: linear-gradient(135deg, #f0f9ff 0%, #f5f3ff 50%, #fdf4ff 100%);
            --bubble-assistant: var(--bg-elevated);
            --bubble-text: var(--text-main);
            --sidebar-bg: linear-gradient(135deg, rgba(255,255,255,0.6) 0%, rgba(255,255,255,0.4) 100%);
            --chat-bg: linear-gradient(135deg, rgba(255,255,255,0.5) 0%, rgba(255,255,255,0.3) 100%);
            --input-bg: var(--bg-elevated);
        }

        body.dark-mode {
            --bg-canvas: #0f172a;
            --bg-elevated: #1e293b;
            --glass-bg: rgba(15, 23, 42, 0.92);
            --glass-border: rgba(255, 255, 255, 0.05);
            --text-main: #f1f5f9;
            --text-sub: #94a3b8;
            --text-muted: #64748b;
            --bg-app: linear-gradient(135deg, #020617 0%, #0f172a 100%);
            --bubble-assistant: #1e293b;
            --bubble-text: #f1f5f9;
            --sidebar-bg: rgba(30, 41, 59, 0.4);
            --chat-bg: rgba(15, 23, 42, 0.3);
            --input-bg: #1e293b;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-app);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-lg);
            font-size: 14.5px;
            color: var(--text-main);
            transition: background 0.4s ease;
        }

        .app-window {
            width: 100%;
            max-width: 1400px;
            height: 85vh;
            background: var(--glass-bg);
            backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xl);
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-xl);
            overflow: hidden;
        }

        header {
            height: 70px;
            padding: 0 var(--spacing-xl);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--glass-border);
            flex-shrink: 0;
        }

        .header-left { display: flex; align-items: center; gap: var(--spacing-md); }
        .logo-container {
            width: 44px; height: 44px; background: #fff;
            border-radius: 8px; padding: 8px; box-shadow: var(--shadow-md);
            display: flex; align-items: center; justify-content: center;
        }
        .logo-container img { width: 100%; height: 100%; object-fit: contain; }
        .logo-placeholder { font-size: 1.4rem; font-weight: 900; color: #1a56db; }
        .header-info h1 { font-size: 1rem; font-weight: 800; line-height: 1.2; }
        .header-info span { font-size: 0.75rem; color: #3b82f6; font-weight: 600; text-transform: uppercase; }

        .status-pill {
            background: var(--bg-elevated); padding: 8px 16px; border-radius: 8px;
            border: 1px solid var(--glass-border); display: flex; align-items: center; gap: 10px;
            font-size: 0.7rem; font-weight: 600; box-shadow: var(--shadow-md);
        }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent-emerald); }

        .main-content {
            display: flex;
            flex: 1;
            overflow: hidden;
            gap: var(--spacing-lg);
            padding: var(--spacing-lg);
            min-height: 0;
        }

        .sidebar {
            width: 320px;
            flex-shrink: 0;
            background: var(--sidebar-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            padding: var(--spacing-md);
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
            box-shadow: var(--shadow-md);
            overflow: hidden;
        }

        .sidebar-section-label {
            font-size: 0.75rem; font-weight: 700; color: var(--text-muted);
            text-transform: uppercase; letter-spacing: 1px;
            margin-bottom: 4px; padding: 0 8px; flex-shrink: 0;
        }

        .files-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: var(--spacing-sm);
            padding-right: 4px;
            min-height: 0;
        }

        .file-item {
            background: var(--bg-elevated); padding: var(--spacing-sm);
            border-radius: var(--radius-md); display: flex; align-items: center; gap: var(--spacing-sm);
            border: 1px solid var(--glass-border); box-shadow: var(--shadow-md); cursor: pointer;
            transition: border-color 0.2s, background-color 0.2s;
        }
        .file-item:hover { border-color: #3b82f6; }
        .file-item input[type="checkbox"] {
            width: 18px; height: 18px; cursor: pointer; margin-left: 5px; accent-color: #3b82f6;
            flex-shrink: 0;
        }

        .btn-apply {
            width: 100%; padding: 12px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white; border: none; border-radius: 8px; font-weight: 700; cursor: pointer;
            transition: opacity 0.2s; display: flex; justify-content: center; align-items: center;
            gap: 8px; flex-shrink: 0;
        }
        .btn-apply:hover { opacity: 0.9; }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--chat-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-md);
            min-width: 0;
        }

        .chat-messages {
            flex: 1;
            padding: var(--spacing-xl);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: var(--spacing-lg);
            min-height: 0;
        }

        .welcome-screen {
            height: 100%; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            text-align: center; color: var(--text-sub);
        }

        .message { display: flex; gap: var(--spacing-md); max-width: 85%; }
        .message.user { align-self: flex-end; flex-direction: row-reverse; }
        .avatar {
            width: 40px; height: 40px; border-radius: var(--radius-md);
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; font-size: 1.1rem; box-shadow: var(--shadow-md);
        }
        .assistant .avatar { background: linear-gradient(135deg, #3b82f6 0%, #14b8a6 100%); color: white; }
        .user .avatar { background: var(--bg-elevated); color: #3b82f6; border: 1px solid var(--glass-border); }
        .bubble {
            padding: 12px 18px; border-radius: var(--radius-lg);
            font-size: 0.95rem; line-height: 1.6; box-shadow: var(--shadow-md);
        }
        .assistant .bubble {
            background: var(--bubble-assistant); color: var(--bubble-text); border-top-left-radius: 4px;
        }
        .user .bubble {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white; border-top-right-radius: 4px;
        }

        .citation-block {
            margin-top: 10px; padding-top: 10px;
            border-top: 1px solid var(--glass-border);
            font-size: 0.8rem; color: var(--text-sub);
        }
        .citation-item {
            background: var(--bg-canvas); padding: 4px 8px; border-radius: 4px;
            display: inline-block; margin: 2px; border: 1px solid var(--glass-border);
        }

        .input-wrapper {
            padding: var(--spacing-lg) var(--spacing-xl);
            background: linear-gradient(to top, var(--bg-canvas) 70%, transparent);
            flex-shrink: 0;
        }
        .input-container {
            max-width: 900px; margin: 0 auto; background: var(--input-bg);
            border-radius: var(--radius-lg); padding: 8px 12px;
            display: flex; align-items: center; gap: var(--spacing-sm);
            box-shadow: var(--shadow-xl); border: 1px solid var(--glass-border);
        }
        .input-container input {
            flex: 1; border: none; padding: 10px; font-family: inherit;
            font-size: 0.95rem; outline: none; color: var(--text-main); background: transparent;
        }
        .action-btn {
            width: 44px; height: 44px; border-radius: var(--radius-md);
            border: none; cursor: pointer; display: flex;
            align-items: center; justify-content: center; font-size: 1rem;
        }
        .btn-send { background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); color: white; }

        .dot-flashing { display: flex; gap: 6px; align-items: center; justify-content: center; }
        .dot-flashing div {
            width: 6px; height: 6px; background: #3b82f6; border-radius: 50%;
            animation: dotPulse 1.4s infinite ease-in-out;
        }
        .dot-flashing div:nth-child(2) { animation-delay: 0.2s; }
        .dot-flashing div:nth-child(3) { animation-delay: 0.4s; }

        @keyframes dotPulse {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 100px; }

        .search-row { display: flex; gap: 8px; margin-bottom: 8px; flex-shrink: 0; }
        .search-input-wrap { position: relative; flex: 1; }
        .search-input-wrap i {
            position: absolute; left: 10px; top: 50%;
            transform: translateY(-50%); color: var(--text-muted); font-size: 0.85rem;
        }
        .search-input-wrap input {
            width: 100%; padding: 10px 10px 10px 30px; border-radius: 8px;
            border: 1px solid var(--glass-border); background: var(--bg-elevated);
            color: var(--text-main); font-family: inherit; font-size: 0.85rem; outline: none;
        }
        .btn-search {
            background: var(--primary); color: white; border: none; border-radius: 8px;
            padding: 0 12px; cursor: pointer; font-weight: 600; font-size: 0.85rem;
        }
        .select-row {
            display: flex; justify-content: space-between;
            padding: 0 4px; margin-bottom: 4px; flex-shrink: 0;
        }
        .select-row span { font-size: 0.7rem; cursor: pointer; font-weight: 600; }
        .select-row span:first-child { color: var(--primary); }
        .select-row span:last-child { color: var(--text-sub); }

        .sidebar-footer {
            flex-shrink: 0;
            margin-top: auto;
            background: var(--bg-elevated);
            padding: var(--spacing-md);
            border-radius: var(--radius-md);
            border: 1px solid var(--glass-border);
        }
        .sidebar-footer p { font-size: 0.75rem; color: var(--text-sub); line-height: 1.5; }
    </style>
</head>
<body>

    <div class="app-window">
        <header>
            <div class="header-left">
                <div class="logo-container">
                    <img src="/static/TATA2.png" alt="Tata Motors"
                         onerror="this.style.display='none'; this.nextElementSibling.style.display='block'">
                    <span class="logo-placeholder" style="display:none;">T</span>
                </div>
                <div class="header-info">
                    <h1>TATA MOTORS</h1>
                    <span>Diagnostics Engine</span>
                </div>
            </div>
            <div style="display: flex; align-items: center; gap: 12px;">
                <button id="themeToggle" class="action-btn"
                        style="background:var(--bg-elevated); border:1px solid var(--glass-border); color:var(--text-main);">
                    <i class="fa-solid fa-moon"></i>
                </button>
                <div class="status-pill">
                    <div class="status-dot" id="statusDot"></div>
                    <span id="statusText">System Ready</span>
                </div>
            </div>
        </header>

        <div class="main-content">
            <aside class="sidebar">
                <div class="sidebar-section-label">Active System Manuals</div>

                <div class="search-row">
                    <div class="search-input-wrap">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" id="manualSearch" placeholder="Search manuals...">
                    </div>
                    <button class="btn-search" onclick="filterManuals()">Search</button>
                </div>

                <div class="select-row">
                    <span onclick="toggleAll(true)">Select All</span>
                    <span onclick="toggleAll(false)">Deselect All</span>
                </div>

                <div class="files-list" id="filesList"></div>

                <button class="btn-apply" onclick="applyFilters()">
                    <i class="fa-solid fa-check"></i>
                    <span id="applyBtnText">All Manuals Selected</span>
                </button>

                <div class="sidebar-footer">
                    <p>
                        <i class="fa-solid fa-hard-drive" style="color:var(--accent-emerald);"></i>
                        <strong>Offline Vault</strong><br>
                        Local Data Execution Only.
                    </p>
                </div>
            </aside>

            <main class="chat-area">
                <div class="chat-messages" id="chatBox">
                    <div class="welcome-screen" id="welcomeScreen">
                        <i class="fa-solid fa-microchip" style="font-size: 3rem; color: #3b82f6; margin-bottom: 20px;"></i>
                        <h2 style="color: var(--text-main);">Offline Diagnostic System</h2>
                        <p>Select your target manuals from the sidebar and ask a question.</p>
                    </div>
                </div>

                <div class="input-wrapper">
                    <div class="input-container">
                        <input type="text" id="userInput"
                               placeholder="Enter DTC code, part number, or symptom..."
                               onkeypress="handleEnter(event)" autocomplete="off">
                        <button class="action-btn btn-send" id="sendBtn" onclick="sendMessage()">
                            <i class="fa-solid fa-arrow-up"></i>
                        </button>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script>
        // Theme Logic
        const themeToggle = document.getElementById('themeToggle');
        const body = document.body;
        const themeIcon = themeToggle.querySelector('i');

        if (localStorage.getItem('theme') === 'dark') {
            body.classList.add('dark-mode');
            themeIcon.classList.replace('fa-moon', 'fa-sun');
        }

        themeToggle.addEventListener('click', () => {
            body.classList.toggle('dark-mode');
            const isDark = body.classList.contains('dark-mode');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeIcon.classList.replace(isDark ? 'fa-moon' : 'fa-sun', isDark ? 'fa-sun' : 'fa-moon');
        });

        // Global variable to hold user's locked-in selection
        let lockedTargetFiles = ["All"];

        // Fetch Loaded Documents and render as checkboxes
        async function fetchDocuments() {
            try {
                const res = await fetch('/documents');
                const docs = await res.json();
                const filesList = document.getElementById('filesList');
                filesList.innerHTML = '';
                docs.forEach((doc) => {
                    const label = document.createElement('label');
                    label.className = 'file-item manual-label';
                    label.innerHTML = `
                        <input type="checkbox" class="manual-checkbox" value="${doc.filename}" checked onchange="updateButtonState()">
                        <div style="flex:1; min-width:0;">
                            <p class="manual-title" style="font-size:0.8rem; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;" title="${doc.filename}">${doc.filename}</p>
                            <p style="font-size:0.65rem; color:var(--text-sub);">${doc.chunks} Indexed Chunks</p>
                        </div>
                    `;
                    filesList.appendChild(label);
                });
                updateButtonState();
            } catch (e) {
                console.error("Could not load documents list.", e);
            }
        }
        window.onload = fetchDocuments;

        function toggleAll(checkState) {
            document.querySelectorAll('.manual-checkbox').forEach(cb => {
                if (cb.closest('.manual-label').style.display !== 'none') {
                    cb.checked = checkState;
                }
            });
            updateButtonState();
        }

        function filterManuals() {
            const input = document.getElementById('manualSearch').value.toLowerCase();
            document.querySelectorAll('.manual-label').forEach(label => {
                const title = label.querySelector('.manual-title').innerText.toLowerCase();
                label.style.display = title.includes(input) ? 'flex' : 'none';
            });
        }

        document.getElementById('manualSearch').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') filterManuals();
        });

        function updateButtonState() {
            const checkboxes = document.querySelectorAll('.manual-checkbox');
            const checkedCount = Array.from(checkboxes).filter(cb => cb.checked).length;
            const btnText = document.getElementById('applyBtnText');
            if (checkedCount === checkboxes.length) {
                btnText.innerText = "All Manuals Selected";
            } else if (checkedCount === 0) {
                btnText.innerText = "Select at least 1 manual";
            } else {
                btnText.innerText = `Apply Filter (${checkedCount} selected)`;
            }
        }

        function applyFilters() {
            const checkboxes = document.querySelectorAll('.manual-checkbox:checked');
            lockedTargetFiles = Array.from(checkboxes).map(cb => cb.value);
            if (lockedTargetFiles.length === 0) lockedTargetFiles = ["All"];

            const btn = document.querySelector('.btn-apply');
            const originalHTML = btn.innerHTML;
            btn.innerHTML = `<i class="fa-solid fa-circle-check"></i> Filter Locked`;
            btn.style.background = "linear-gradient(135deg, #3b82f6 0%, #2563eb 100%)";
            setTimeout(() => {
                btn.innerHTML = originalHTML;
                btn.style.background = "linear-gradient(135deg, #10b981 0%, #059669 100%)";
            }, 2000);
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const chatBox = document.getElementById('chatBox');
            const sendBtn = document.getElementById('sendBtn');
            const msg = input.value.trim();
            if (!msg) return;

            const welcome = document.getElementById('welcomeScreen');
            if (welcome) welcome.style.display = 'none';

            addMessage("You", msg, true);
            input.value = "";
            input.disabled = true;
            sendBtn.disabled = true;

            const botMsgDiv = addMessage("TATA Assistant", "", false);
            const contentDiv = botMsgDiv.querySelector('.bubble');
            contentDiv.innerHTML = `<div class="dot-flashing"><div></div><div></div><div></div></div>`;

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ message: msg, target_files: lockedTargetFiles })
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let isFirstToken = true;
                let citations = [];

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');
                    for (const line of lines) {
                        if (!line.trim()) continue;
                        try {
                            const data = JSON.parse(line);
                            if (data.type === 'context') {
                                citations = data.data;
                            } else if (data.type === 'token') {
                                if (isFirstToken) { contentDiv.innerText = ""; isFirstToken = false; }
                                contentDiv.innerText += data.content;
                                chatBox.scrollTop = chatBox.scrollHeight;
                            } else if (data.type === 'error') {
                                // Server streamed an error — show it and unfreeze
                                if (isFirstToken) { contentDiv.innerText = ""; isFirstToken = false; }
                                contentDiv.innerHTML = `<span style="color:var(--accent-rose)"><i class="fa-solid fa-circle-exclamation"></i> ${data.message}</span>`;
                                chatBox.scrollTop = chatBox.scrollHeight;
                            } else if (data.type === 'done') {
                                // Append citations only if we actually retrieved some
                                if (citations.length > 0) {
                                    let citationHTML = `<div class="citation-block"><strong>Sources:</strong><br>`;
                                    citations.forEach(c => {
                                        citationHTML += `<span class="citation-item"><i class="fa-solid fa-file-pdf"></i> ${c.source} (Page ${c.page})</span>`;
                                    });
                                    citationHTML += `</div>`;
                                    contentDiv.innerHTML += citationHTML;
                                    chatBox.scrollTop = chatBox.scrollHeight;
                                }
                            }
                        } catch (e) {}
                    }
                }
            } catch (e) {
                contentDiv.innerHTML = `<span style="color:var(--accent-rose)"><i class="fa-solid fa-circle-exclamation"></i> Connection error. Please verify Ollama is running.</span>`;
            } finally {
                // Always re-enable input regardless of success or failure
                input.disabled = false;
                sendBtn.disabled = false;
                input.focus();
            }
        }

        function addMessage(sender, text, isUser) {
            const chatBox = document.getElementById('chatBox');
            const div = document.createElement('div');
            div.className = `message ${isUser ? 'user' : 'assistant'}`;
            const icon = isUser ? '<i class="fa-solid fa-user"></i>' : '<i class="fa-solid fa-wrench"></i>';
            div.innerHTML = `
                <div class="avatar">${icon}</div>
                <div class="bubble">${text}</div>
            `;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
            return div;
        }

        function handleEnter(e) { if (e.key === 'Enter') sendMessage(); }
    </script>
</body>
</html>
